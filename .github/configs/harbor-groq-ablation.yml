job_name: harbor-groq-free-ablation
jobs_dir: jobs/groq-ablation
n_attempts: 3
n_concurrent_trials: 1
environment:
  type: docker
tasks:
  - path: tasks/reconcile-bug
agents:
  - name: terminus-2
    model_name: groq/qwen/qwen3.8-27b
    model_api_key_name: GROQ_API_KEY
    kwargs:
      llm_call_kwargs:
        max_tokens: 768
        num_retries: 6
    env:
      GROQ_API_KEY: ${GROQ_API_KEY}
