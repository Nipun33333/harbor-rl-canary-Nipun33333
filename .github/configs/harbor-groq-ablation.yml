# Groq FREE plan only. Identical agent/model configuration to the baseline arm
# (and to the smoke config) so the single ablation edit stays the only
# difference between Run 1 and Run 2. scripts/validate_job_configs.py enforces
# that equality.
job_name: harbor-groq-free-ablation
jobs_dir: jobs/groq-ablation
n_attempts: 3
n_concurrent_trials: 1
retry:
  max_retries: 0
environment:
  type: docker
tasks:
  - path: tasks/reconcile-bug
agents:
  - name: terminus-2
    model_name: groq/qwen/qwen3.8-27b
    model_api_key_name: GROQ_API_KEY
    override_timeout_sec: 900
    temperature: 0
    kwargs:
      max_turns: 4
      parser_name: json
      enable_summarize: false
      proactive_summarization_threshold: 0
      reasoning_effort: none
      tmux_pane_width: 100
      tmux_pane_height: 20
      llm_call_kwargs:
        max_tokens: 700
        num_retries: 0
    env:
      GROQ_API_KEY: ${GROQ_API_KEY}
