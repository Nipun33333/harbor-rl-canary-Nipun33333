name: Publish complete project source and verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble verified archive parts and extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/harbor-project
          cat upload_parts/part-* > /tmp/project_bundle.b64
          base64 --decode /tmp/project_bundle.b64 > project_bundle.zip
          unzip -tq project_bundle.zip
          unzip -q project_bundle.zip -d /tmp/harbor-project
          cp -a /tmp/harbor-project/. .
          rm -rf project_bundle.zip upload_parts .github/trigger-bootstrap.txt .github/workflows/bootstrap-project.yml
          test -f tasks/reconcile-bug/task.toml
          test -f scripts/run_local_validation.sh

      - name: Run real local reward-verifier checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_local_validation.sh | tee /tmp/harbor-local-validation.log

      - name: Commit project source (leave workflow files to repository integration)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m "Publish full Harbor RL task and verifier"
            git push origin HEAD:main
          fi

      - name: Upload local validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-local-validation-log
          path: /tmp/harbor-local-validation.log
          if-no-files-found: warn
          retention-days: 30
