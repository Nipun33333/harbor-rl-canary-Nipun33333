name: Harbor LLM trials (FREE Groq model only)

concurrency:
  group: harbor-groq-free-trials
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harbor-trials:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check out submission
        uses: actions/checkout@v4

      - name: Confirm free Groq Qwen model availability (no inference call)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing GROQ_API_KEY. Add it under Settings > Secrets and variables > Actions." >&2
            exit 2
          fi
          curl --fail --silent --show-error \
            https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -o /tmp/groq-models.json
          python - <<'PYMODELS'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/groq-models.json").read_text())
          model_ids = {item.get("id") for item in data.get("data", [])}
          expected = "qwen/qwen3.8-27b"
          if expected not in model_ids:
              raise SystemExit(
                  f"Required model {expected!r} is not accessible to this key."
              )
          print(f"Confirmed model listing: {expected}")
          PYMODELS

      - name: Install uv and Harbor
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install harbor==0.26.0
          harbor --version

      - name: Use binary verifier for assignment calibration
        run: bash scripts/use_binary_verifier.sh

      - name: Run baseline group (three sequential trials)
        run: |
          set -euo pipefail
          cp tasks/reconcile-bug/instruction.baseline.md tasks/reconcile-bug/instruction.md
          harbor run --config .github/configs/harbor-groq-baseline.yml --yes
          python - <<'PYRESULT'
          import json
          from pathlib import Path

          path = Path("jobs/groq-baseline/harbor-groq-free-baseline/result.json")
          data = json.loads(path.read_text())
          stats = data.get("stats", {})
          expected = 3
          if (
              stats.get("n_total_trials") != expected
              or stats.get("n_completed_trials") != expected
              or stats.get("n_errored_trials", 0) != 0
          ):
              raise SystemExit(
                  "Baseline group did not produce three error-free trials: "
                  + json.dumps(stats, sort_keys=True)
              )
          for name, group in stats.get("evals", {}).items():
              if group.get("n_trials") != expected or group.get("n_errors", 0) != 0:
                  raise SystemExit(f"Baseline evaluation has errors: {name}: {group}")
          print("Baseline validation passed: 3/3 trials completed without exceptions.")
          PYRESULT

      - name: Run one-change ablation group (three sequential trials)
        run: |
          set -euo pipefail
          # Let the Free-plan per-minute token window recover before the next group.
          sleep 60
          cp tasks/reconcile-bug/instruction.ablation.md tasks/reconcile-bug/instruction.md
          harbor run --config .github/configs/harbor-groq-ablation.yml --yes
          python - <<'PYRESULT'
          import json
          from pathlib import Path

          path = Path("jobs/groq-ablation/harbor-groq-free-ablation/result.json")
          data = json.loads(path.read_text())
          stats = data.get("stats", {})
          expected = 3
          if (
              stats.get("n_total_trials") != expected
              or stats.get("n_completed_trials") != expected
              or stats.get("n_errored_trials", 0) != 0
          ):
              raise SystemExit(
                  "Ablation group did not produce three error-free trials: "
                  + json.dumps(stats, sort_keys=True)
              )
          for name, group in stats.get("evals", {}).items():
              if group.get("n_trials") != expected or group.get("n_errors", 0) != 0:
                  raise SystemExit(f"Ablation evaluation has errors: {name}: {group}")
          print("Ablation validation passed: 3/3 trials completed without exceptions.")
          PYRESULT

      - name: Upload real Harbor result.json and trajectory.json files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-free-groq-baseline-and-ablation-jobs
          path: jobs/
          if-no-files-found: warn
          retention-days: 30
