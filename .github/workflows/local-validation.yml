name: Local reward verifier and Harbor smoke test

concurrency:
  group: harbor-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verifier calibration and anti-cheat tests
        run: bash scripts/run_local_validation.sh

  harbor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv and Harbor
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install harbor==0.26.0
          harbor --version
      - name: Validate Groq JobConfigs without making an inference call
        env:
          GROQ_API_KEY: validation-placeholder-not-a-real-key
        shell: bash
        run: |
          set -euo pipefail
          harbor run --config .github/configs/harbor-groq-baseline.yml --print-config > /tmp/groq-baseline-config.json
          harbor run --config .github/configs/harbor-groq-ablation.yml --print-config > /tmp/groq-ablation-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          for path in ("/tmp/groq-baseline-config.json", "/tmp/groq-ablation-config.json"):
              config = json.loads(Path(path).read_text())
              assert config["agents"][0]["name"] == "terminus-2"
              assert config["agents"][0]["model_name"] == "groq/openai/gpt-oss-20b"
              assert config["tasks"][0]["path"].endswith("tasks/reconcile-bug")
              assert config["n_attempts"] == 3
          print("Both Groq JobConfigs are valid; no model inference was called.")
          PY
      - name: Run Harbor no-op Docker smoke trial
        run: harbor run --config .github/configs/harbor-nop-smoke.yml --yes
      - name: Run Harbor oracle Docker smoke trial
        run: harbor run --config .github/configs/harbor-oracle-smoke.yml --yes
      - name: Upload Harbor smoke result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-oracle-and-nop-smoke-results
          path: jobs/
          if-no-files-found: warn
          retention-days: 30
