name: Local reward verifier and Harbor smoke test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verifier calibration and anti-cheat tests
        run: bash scripts/run_local_validation.sh

  harbor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv and Harbor
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install harbor
          harbor --help
      - name: Run Harbor no-op smoke trial
        run: harbor run --path ./tasks --agent nop --n-concurrent 1
      - name: Run Harbor oracle solution smoke trial
        run: harbor run --path ./tasks --agent oracle --n-concurrent 1
      - name: Upload Harbor smoke result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-oracle-and-nop-smoke-results
          path: jobs/
          if-no-files-found: warn
          retention-days: 30
